<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jessyca Athalia</title>
<meta name="description" content="Jessyca Athalia — personal site.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  :root {
    --bg: #faf9f7;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --rule: #e2e0dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --fg: #f2f0ec;
      --muted: #8d8a84;
      --rule: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.25rem, 9vw, 3.75rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 1.25rem;
  }
  .rule {
    width: 3rem;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 1.25rem;
    border: 0;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main>
    <h1>Jessyca Athalia</h1>
    <hr class="rule">
    <p>Coming soon</p>
  </main>
</body>
</html>
