<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 21st Birthday, Jessyca Athalia</title>
<meta name="description" content="For Jessyca Athalia — 10 November.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#1b0713; --deep:#2d0f22; --paper:#fff1f5; --paper-ink:#3d0a22;
    --pink:#ff2d6f; --pink-2:#ff4d88; --blush:#ffd7e4; --soft:#ffa6c1; --gold:#ffd76e;
    --pixel:'Pixelify Sans',ui-monospace,monospace;
    --hud:'Press Start 2P',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);
    font-family:var(--pixel);-webkit-font-smoothing:none;overflow:hidden;overscroll-behavior:none}
  a{color:var(--gold)}a:hover{color:var(--pink)}
  #app{position:fixed;inset:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(circle at 50% 34%,#43132e 0%,#1b0713 76%);contain:paint}
  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hearts span{position:absolute;bottom:-40px;will-change:transform,opacity;animation:rise linear infinite}
  @keyframes rise{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
    10%{opacity:.5}100%{transform:translate3d(0,-115vh,0) rotate(22deg);opacity:0}}
  .hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:6}
  .hp{display:flex;gap:5px}
  .hp span{font-size:15px;line-height:1;font-family:var(--pixel);font-weight:700}
  .chips{display:flex;gap:8px;align-items:center}
  .chip{font-family:var(--pixel);font-weight:700;font-size:13px;letter-spacing:.04em;line-height:1;
    color:var(--soft);border:2px solid var(--pink-2);padding:6px 8px;background:rgba(27,7,19,.5)}
  .chip.gold{color:var(--gold)}
  .chip.mute{color:#b4527a}
  #film{position:absolute;inset:0;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
  @keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.022) translate3d(0,-8px,0)}}
  #overlay{position:absolute;inset:0;z-index:7}
  .ovs{position:absolute;inset:0;opacity:0;transform:scale(1.035);will-change:opacity,transform;
    transition:opacity .85s ease,transform .95s cubic-bezier(.16,.84,.32,1)}
  .ovs.on{opacity:1;transform:none}
  .ovs.out{opacity:0;transform:scale(.985);pointer-events:none}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:76px 22px 58px;text-align:center;
    --fw:min(86vw,420px);--fh:calc(min(86vw,420px)*.75);
    transition:opacity .8s ease,transform .9s cubic-bezier(.16,.84,.32,1)}
  .stage.tall{--fh:min(56vh,560px);--fw:calc(min(56vh,560px)*.5625)}
  .stage.dim{opacity:0;transform:scale(.96);pointer-events:none}
  .layers{position:absolute;inset:0}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .95s ease;will-change:opacity}
  .layer.on{opacity:1}
  .layer img,.layer video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.12) contrast(1.05)}
  .layer img{animation:ken 20s ease-out both;will-change:transform}
  @keyframes ken{from{transform:scale(1.002)}to{transform:scale(1.09)}}
  .swapout{opacity:0!important;transform:translate3d(0,7px,0)}
  .box .tag,.wtext,.box .meta{transition:opacity .3s ease,transform .3s ease}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  h1{font-family:var(--pixel);font-weight:700;font-size:clamp(34px,9vw,74px);line-height:1.04;margin:0;
    color:var(--paper);text-shadow:5px 5px 0 var(--pink)}
  h2{font-family:var(--pixel);font-weight:500;font-size:clamp(20px,5vw,32px);line-height:1.3;margin:0;color:var(--blush)}
  .prompt{font-family:var(--pixel);font-weight:700;letter-spacing:.05em;font-size:15px;color:var(--gold);
    animation:blink 1.2s steps(1) infinite}
  .mapcap{position:absolute;left:6%;right:6%;bottom:11%;text-align:center;pointer-events:none;z-index:2;
    font-family:var(--pixel);font-weight:700;font-size:clamp(20px,5.4vw,34px);line-height:1.25;
    color:var(--paper);text-shadow:4px 4px 0 var(--pink);opacity:0;transition:opacity .5s ease;text-wrap:pretty}
  .frame{border:5px solid var(--blush);box-shadow:0 0 0 5px var(--ink),0 0 0 9px var(--pink-2);
    background:var(--deep);overflow:hidden}
  .box{position:relative;transition:opacity .55s ease,transform .7s cubic-bezier(.16,.84,.32,1),height .7s cubic-bezier(.4,0,.2,1);background:var(--paper);color:var(--paper-ink);text-align:left;
    border:5px solid var(--pink-2);box-shadow:0 0 0 5px var(--ink),0 0 0 9px var(--blush);
    padding:26px 22px 30px;max-width:760px;width:100%}
  .box .tag{position:absolute;top:-16px;left:16px;background:var(--pink);color:var(--paper);
    font-family:var(--pixel);font-weight:700;letter-spacing:.04em;font-size:13px;line-height:1;padding:8px 10px}
  .box p{margin:0;font-family:var(--pixel);font-weight:500;font-size:clamp(19px,4.6vw,26px);line-height:1.45}
  .box .meta{margin-top:14px;font-family:var(--pixel);font-weight:700;font-size:13px;letter-spacing:.04em;color:#b4527a}
  .box.hide{opacity:0;transform:translate3d(0,16px,0) scale(.99);pointer-events:none}
  .wtext{margin:0;font-family:var(--pixel);font-weight:500;font-size:clamp(19px,4.6vw,26px);line-height:1.45}
  .box .caret{position:absolute;right:14px;bottom:10px;font-size:15px;color:var(--pink);animation:bob 1s ease-in-out infinite}
  .media{position:relative;width:var(--fw);height:var(--fh);flex:none;
    transition:width 1s cubic-bezier(.5,0,.18,1),height 1s cubic-bezier(.5,0,.18,1)}
  .mapwrap{position:absolute;inset:0;z-index:5;background:var(--ink);overflow:hidden;opacity:0;
    transition:opacity .8s ease,top .95s cubic-bezier(.22,.61,.36,1),left .95s cubic-bezier(.22,.61,.36,1),
      right .95s cubic-bezier(.22,.61,.36,1),bottom .95s cubic-bezier(.22,.61,.36,1),border-width .95s cubic-bezier(.22,.61,.36,1);
    border:0 solid var(--blush)}
  .mapwrap svg{width:100%;height:100%;display:block}
  .ovs .stage{overflow:hidden}
  .letter{display:flex;flex-direction:column;gap:16px;flex:0 1 auto;min-height:0;max-height:100%;overflow:auto}
  .letter .sig{font-family:var(--pixel);font-weight:700;font-size:clamp(23px,5.5vw,30px);color:var(--pink);margin-top:auto}
  .btn{border:4px solid var(--pink-2);color:var(--paper);font-family:var(--pixel);font-weight:700;
    letter-spacing:.05em;font-size:15px;padding:15px;text-align:center;cursor:pointer;background:none}
  .btn:hover{background:var(--pink)}
  .play{position:absolute;top:50%;left:50%;opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) scale(.72);transition:opacity .7s ease,transform .8s cubic-bezier(.16,.84,.32,1);
    width:clamp(72px,18vw,104px);aspect-ratio:1;border:5px solid var(--pink-2);background:rgba(27,7,19,.6);
    display:flex;align-items:center;justify-content:center}
  .play i{display:block;width:0;height:0;border-left:.32em solid var(--paper);
    border-top:.2em solid transparent;border-bottom:.2em solid transparent;font-size:clamp(72px,18vw,104px);margin-left:.06em}
  .play.on{opacity:1;transform:translate(-50%,-50%)}
  .burst{position:absolute;top:44%;left:50%;z-index:9;pointer-events:none}
  .burst span{position:absolute;will-change:transform,opacity}
  @media (min-width:860px) and (orientation:landscape){
    .stage{flex-direction:row;gap:34px;padding:96px 40px 40px;text-align:left;align-items:center}
    .stage.center{flex-direction:column;text-align:center}
    .stage{--fw:min(46vw,620px);--fh:min(70vh,620px)}
    .stage.tall{--fh:min(74vh,660px);--fw:calc(min(74vh,660px)*.5625)}
    .box{max-width:min(42vw,560px)}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="mapwrap" id="mapwrap" hidden><svg id="mapsvg" viewBox="0 0 420 300" preserveAspectRatio="xMidYMid slice"></svg><div class="mapcap" id="mapcap"></div></div>
<audio id="song" loop preload="none"></audio>

<script>
/* ─── EDIT ME ────────────────────────────────────────────────────────────────
   Drop your files in assets/ :  video.mp4   song.mp3   photo1.jpg …
   Then edit MEMORIES below — one entry per photo.                            */
const MEMORIES = [
  { src: 'assets/photo1.jpg', note: 'You were mid-sentence about something unimportant and I remember thinking: oh no. Oh no, I like her.', date: 'THE BEGINNING' },
  { src: 'assets/photo2.jpg', note: 'Your note goes here. Two or three lines, in your voice — short beats clever.', date: 'YOUR CAPTION' },
  { src: 'assets/photo3.jpg', note: 'I keep this one on my lock screen. You know that already.', date: 'A TUESDAY' },
  { src: 'assets/photo1.jpg', note: 'Nothing happened this day. That is exactly why I kept the photo.', date: 'SOMETIME IN JULY' },
  { src: 'assets/photo2.jpg', note: 'You laughed so hard the photo came out blurry. Keeping it blurry.', date: 'YOUR CAPTION' },
  { src: 'assets/photo3.jpg', note: 'Cold hands. Warm everything else.', date: 'LAST DECEMBER' },
  { src: 'assets/photo1.jpg', note: 'Twenty-one looks good on you. So did twenty.', date: 'THIS YEAR' },
  { src: 'assets/photo2.jpg', note: 'If I had to explain us to someone, I would just show them this.', date: 'YOUR CAPTION' },
  { src: 'assets/photo3.jpg', note: 'Same time next year, and the one after that.', date: '10 NOVEMBER' },
];
const LETTER = 'Your long letter goes here — the one you\u2019d never say out loud. Four short paragraphs is plenty; plain sentences land hardest.';
const VIDEO_WORDS = 'I was never good at saying my feelings out loud, but here is me trying and i hope it reaches you \u2665';
const MAP_WORDS = 'U were born on 10th November 2005 in Pasuruan, Then u moved out to Surabaya and thats where you met me \uD83D\uDC97';
const MAP_MS = 95200;
/* ───────────────────────────────────────────────────────────────────────── */

const app = document.getElementById('app');
const song = document.getElementById('song');
const N = MEMORIES.length;
const LAST = N + 3;               // 0 hi · 1 map · 2 video-intro · 3 video · 4..N+2 photos · N+3 letter
let step = 0, mapDone = false, musicOn = false;

function heartsLayer() {
  const cfg = [[7, 14, 9, 0], [26, 10, 11, 1.6], [47, 17, 8.4, 3.1], [68, 11, 12, .7], [86, 15, 10, 2.3]];
  const colors = ['#ff2d6f', '#ffa6c1', '#ff2d6f', '#ffd76e', '#ffa6c1'];
  return '<div class="hearts">' + cfg.map((c, i) =>
    '<span style="left:' + c[0] + '%;font-size:' + c[1] + 'px;color:' + colors[i] +
    ';animation-duration:' + c[2] + 's;animation-delay:' + c[3] + 's">\u2665</span>').join('') + '</div>';
}
function hud() {
  const got = step < 4 ? 0 : Math.min(N, step - 3);
  const hp = Array.from({ length: N }, (_, i) =>
    '<span style="color:' + (i < got ? '#ff2d6f' : '#5c2038') + '">\u2665</span>').join('');
  const label = step === 0 ? 'START' : step === 1 ? 'MAP' : step === 2 ? 'VIDEO'
    : step === 3 ? 'PLAYING' : step === LAST ? 'END' : String(step - 3).padStart(2, '0') + '/09';
  const music = step === 3 ? '<div class="chip mute">\u266A PAUSED</div>'
    : '<div class="chip gold">\u266A ' + (musicOn ? 'ON' : 'TAP FOR MUSIC') + '</div>';
  return '<div class="hud"><div class="hp">' + hp + '</div><div class="chips">' + music +
    '<div class="chip">' + label + '</div><div class="chip">LV 21</div></div></div>';
}
function box(tag, text, meta) {
  return '<div class="box"><div class="tag">' + tag + '</div><p>' + text + '</p>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') + '<div class="caret">\u25BC</div></div>';
}
function burst() {
  const dirs = [[-170, -250], [160, -270], [-220, -60], [215, -40], [-130, 210], [140, 230], [-30, -320], [40, 300]];
  const cols = ['#ff2d6f', '#ffd7e4', '#ffd76e', '#ffa6c1'];
  return '<div class="burst">' + dirs.concat(dirs).map((d, i) => {
    const dur = 1.8 + (i % 5) * .18, del = (i > 7 ? .18 : 0) + (i % 4) * .05, sz = 13 + (i % 6) * 3;
    return '<span style="font-size:' + sz + 'px;color:' + cols[i % 4] + ';animation:burst' +
      (i % 8) + ' ' + dur + 's cubic-bezier(.1,.7,.3,1) ' + del + 's both">\u2665</span>';
  }).join('') + '</div>';
}
(function injectBurstKeyframes() {
  const dirs = [[-170, -250], [160, -270], [-220, -60], [215, -40], [-130, 210], [140, 230], [-30, -320], [40, 300]];
  const css = dirs.map((d, i) => '@keyframes burst' + i + '{from{opacity:1;transform:translate3d(0,0,0) scale(.4)}' +
    'to{opacity:0;transform:translate3d(' + d[0] + 'px,' + d[1] + 'px,0) scale(1.4) rotate(' + (i % 2 ? 30 : -35) + 'deg)}}').join('');
  const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
})();

app.innerHTML = heartsLayer() + '<div id="hudslot"></div>' +
  '<div id="film">' +
    '<div class="stage" id="stage">' +
      '<div class="frame media" id="frame"><div class="layers" id="layers"></div>' +
        '<div class="play" id="playbtn"><i></i></div></div>' +
      '<div class="box hide" id="wordbox"><div class="tag" id="wtag"></div>' +
        '<div class="wtext" id="wtext"></div><div class="meta" id="wmeta"></div>' +
        '<div class="caret">\u25BC</div></div>' +
    '</div>' +
    '<div id="overlay"></div>' +
  '</div>';

const $ = id => document.getElementById(id);

/* one film frame; only what is inside it changes */
function setLayer(key, html) {
  const layers = $('layers'), cur = layers.lastElementChild;
  if (cur && cur.dataset.key === key) return cur;
  const el = document.createElement('div');
  el.className = 'layer'; el.dataset.key = key; el.innerHTML = html || '';
  layers.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));
  Array.from(layers.children).forEach(c => {
    if (c !== el) { c.classList.remove('on'); setTimeout(() => c.remove(), 1000); }
  });
  return el;
}

/* the words never re-mount — the paper stays, the writing changes */
let wordT = null;
function setWords(tag, text, meta) {
  const bx = $('wordbox');
  clearTimeout(wordT);
  if (!text) { bx.classList.add('hide'); return; }
  if ($('wtext').textContent === text) { bx.classList.remove('hide'); return; }
  const hidden = bx.classList.contains('hide');
  const h0 = hidden ? 0 : bx.offsetHeight;
  const parts = [$('wtag'), $('wtext'), $('wmeta')];
  parts.forEach(n => n.classList.add('swapout'));
  wordT = setTimeout(() => {
    $('wtag').textContent = tag; $('wtext').textContent = text; $('wmeta').textContent = meta || '';
    bx.classList.remove('hide');
    bx.style.height = 'auto';
    const h1 = bx.offsetHeight;
    if (h0 && h0 !== h1) {
      bx.style.height = h0 + 'px';
      requestAnimationFrame(() => { bx.style.height = h1 + 'px'; });
      setTimeout(() => { bx.style.height = ''; }, 760);
    } else bx.style.height = '';
    parts.forEach(n => n.classList.remove('swapout'));
  }, hidden ? 0 : 260);
}

function setOverlay(html) {
  const ov = $('overlay'), cur = ov.lastElementChild;
  if (cur) {
    if (cur.dataset.key === html) return;
    cur.classList.add('out');
    setTimeout(() => cur.remove(), 900);
  }
  if (!html) return;
  const el = document.createElement('div');
  el.className = 'ovs'; el.dataset.key = html; el.innerHTML = html;
  ov.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));
}

function render(opts) {
  opts = opts || {};
  $('hudslot').innerHTML = hud();
  if (opts.burst) {
    const b = document.createElement('div');
    b.innerHTML = burst();
    const node = b.firstElementChild;
    app.appendChild(node);
    setTimeout(() => node.remove(), 3200);
  }
  const stage = $('stage');
  stage.classList.toggle('tall', step === 2 || step === 3);
  stage.classList.toggle('dim', step === 0 || step === LAST);
  $('playbtn').classList.toggle('on', step === 2);

  if (step === 0) {
    setOverlay('<div class="stage center"><div style="font-size:46px;color:#ff2d6f;animation:bob 1.6s ease-in-out infinite">\u2665</div>' +
      '<h1>HAPPY 21ST<br>BIRTHDAY</h1><h2>Jessyca Athalia</h2>' +
      '<div class="prompt">CLICK TO CONTINUE \u25B8</div></div>');
    setWords('', '', '');
  } else if (step === 1) {
    setOverlay('');
    setLayer('map', '');
    setWords(mapDone ? 'LOCATION' : '', mapDone ? MAP_WORDS : '', 'PASURUAN \u2192 SURABAYA \u00B7 EAST JAVA');
  } else if (step === 2) {
    setOverlay('');
    setLayer('invite', '');
    setWords('CLEMENT', 'Hi Jess, I made a video for you. Wanna watch?', 'TAP TO PLAY IT');
  } else if (step === 3) {
    setLayer('video', '<video id="vid" playsinline controls autoplay src="assets/video.mp4"></video>');
    setWords('WORDS FROM CLEMENT', VIDEO_WORDS, '');
  } else if (step === LAST) {
    setOverlay('<div class="stage center"><div class="prompt" style="animation:none;color:var(--gold);font-size:18px">\u2665 THE LAST ONE \u2665</div>' +
      '<div class="box letter"><div class="tag">CLEMENT</div><p>' + LETTER + '</p>' +
      '<div class="sig">HAPPY BIRTHDAY, JESS \u2665</div></div>' +
      '<div class="btn" id="again">\u25B6 PLAY IT AGAIN</div></div>');
    setWords('', '', '');
  } else {
    const m = MEMORIES[step - 4];
    setOverlay('');
    setLayer('m' + step, '<img src="' + m.src + '" alt="">');
    setWords('CLEMENT', m.note, 'MEMORY ' + String(step - 3).padStart(2, '0') + ' / 09 \u00B7 ' + m.date);
  }
  syncMap();

  if (step === 1) startMap();
  if (step === 3) {
    const v = $('vid');
    if (song) song.pause();
    if (v) {
      v.addEventListener('ended', next);
      v.addEventListener('error', () => {
        v.parentNode.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;' +
          'text-align:center;padding:20px;font-family:var(--pixel);font-weight:700;font-size:14px;color:#ffa6c1">' +
          'drop your clip at<br>assets/video.mp4</div>';
      });
    }
  } else if (musicOn && song && song.paused && song.getAttribute('src')) { song.play().catch(() => {}); }
}

function next(e) {
  if (e && e.target && (e.target.tagName === 'VIDEO' || e.target.closest('video'))) return;
  if (step === 1 && !mapDone) {
    clearTimeout(window.__mapT);
    mapDone = true;
    render();
    return;
  }
  if (!musicOn && song) {
    if (!song.getAttribute('src')) song.setAttribute('src', 'assets/song.mp3');
    song.play().catch(() => {});
    musicOn = true;
  }
  const wasStart = step === 0;
  step = (step + 1) % (LAST + 1);
  mapDone = false;
  clearTimeout(window.__mapT);
  if (step === 1) window.__mapT = setTimeout(() => { mapDone = true; render(); }, MAP_MS);
  render({ burst: wasStart });
}
app.addEventListener('click', next);
window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') next(); });

function syncMap() {
  const w = $('mapwrap');
  if (!w) return;
  clearTimeout(window.__mapHide);
  if (step !== 1) {
    w.style.opacity = '0';
    window.__mapHide = setTimeout(() => { w.hidden = true; w.removeAttribute('style'); }, 980);
    return;
  }
  w.hidden = false;
  requestAnimationFrame(() => { w.style.opacity = '1'; });
  if (!mapDone) {
    w.style.top = w.style.left = w.style.right = w.style.bottom = '0';
    w.style.borderWidth = '0';
    w.style.boxShadow = 'none';
    w.style.zIndex = '5';
    return;
  }
  const r = $('frame').getBoundingClientRect();
  w.style.top = r.top + 'px'; w.style.left = r.left + 'px';
  w.style.right = (window.innerWidth - r.right) + 'px';
  w.style.bottom = (window.innerHeight - r.bottom) + 'px';
  w.style.borderWidth = '5px';
  w.style.zIndex = '4';
  w.style.boxShadow = '0 0 0 5px var(--ink),0 0 0 9px var(--pink-2)';
}

/* ── the earth → Pasuruan → Surabaya animation ───────────────────────────── */
let WORLD = null;
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
  .then(t => { WORLD = topojson.feature(t, t.objects.countries).features; if (step === 1) startMap(); });

function startMap() {
  const svgEl = document.getElementById('mapsvg');
  if (!svgEl || !WORLD || svgEl.dataset.on) return;
  svgEl.dataset.on = '1';
  storyScene(svgEl, document.getElementById('mapcap'), WORLD);
}

    jesGlow.attr('opacity', nm === 'baby' ? jesO * .7 : (nm === 'grow' ? jesO * .3 * (1 - t) : 0))
      .attr('rx', jesH * 1.6).attr('ry', jesH * 1.6)
      .attr('transform', 'translate(' + jes.x + ',' + (jes.y - jesH * .55) + ')');

    var tagOn = castO * (nm === 'meet' ? cl((raw - .6) / .25) : 1);
    tagD.attr('opacity', tagOn).attr('transform', 'translate(' + dad.x + ',' + (FLOOR - dad.h - 9) + ')');
    tagM.attr('opacity', tagOn).attr('transform', 'translate(' + mom.x + ',' + (FLOOR - mom.h - 9) + ')');
    tagC.attr('opacity', cleO * (nm === 'potin' ? cl((raw - .82) / .18) : 1))
      .attr('transform', 'translate(' + cle.x + ',' + (FLOOR - cle.h - 9) + ')');
    tagJ.attr('opacity', jesO * (nm === 'baby' ? cl((raw - .38) / .3) : (nm === 'pot' ? cl((raw - .34) / .3) : 1)))
      .attr('transform', 'translate(' + (jes.x + (jes.y < FLOOR - 8 ? -38 : 0)) + ',' + (jes.y - jesH - 9) + ')');

    var hy = (nm === 'pot' || nm === 'pot2') ? 198 : 212;
    hearts.attr('opacity', function (d) { var u = ((ms / 2600) + d.o) % 1; return heartA * Math.sin(u * Math.PI) * .9; })
      .attr('font-size', function (d) { return 8 * d.s; })
      .attr('transform', function (d) {
        var u = ((ms / 2600) + d.o) % 1;
        return 'translate(' + (d.x + Math.sin(u * 7 + d.o * 6) * 5) + ',' + (hy - u * 96) + ')';
      });
    if (starT >= 0) {
      var sx = lerp(W * .3, 0, eo(starT)), sy = lerp(-46, FLOOR - 36, starT * starT * .55 + starT * .45);
      starG.attr('opacity', 1).attr('transform', 'translate(' + sx + ',' + sy + ')');
    } else starG.attr('opacity', 0);
    flare.attr('opacity', flareT > 0 ? (1 - flareT) * .9 : 0).attr('r', flareT > 0 ? 4 + flareT * 66 : 0)
      .attr('transform', 'translate(0,' + (FLOOR - 36) + ')');

    gSide.attr('opacity', sideO);
    if (sideX !== null) sideCar.attr('transform', 'translate(' + sideX + ',' + (FLOOR - 8) + ')');
    riders.attr('opacity', ridersO);

    var p = projection(PAS), s2 = projection(SBY);
    pinP.attr('transform', 'translate(' + p[0] + ',' + p[1] + ')').attr('opacity', pOn * globeO);
    pinS.attr('transform', 'translate(' + s2[0] + ',' + s2[1] + ')').attr('opacity', sOn * globeO);
    var reached = carT < 0 ? 0 : carT;
    dots.attr('opacity', function (f) { return dotOn * globeO * cl((reached - f) * 14); })
      .attr('transform', function (f) { var q = projection(route(f)); return 'translate(' + q[0] + ',' + q[1] + ')'; });
    if (carT >= 0 && nm === 'drive') {
      var a1 = projection(route(Math.max(0, carT - .02))), b1 = projection(route(Math.min(1, carT + .02)));
      var c2 = projection(route(carT));
      var ang = Math.atan2(b1[1] - a1[1], b1[0] - a1[0]) * 180 / Math.PI;
      gCar.attr('opacity', globeO).attr('transform', 'translate(' + c2[0] + ',' + c2[1] + ') rotate(' + ang + ')');
      mapCar.attr('transform', 'translate(0,' + Math.sin(ms / 55) * .5 + ') scale(1.25)' + (Math.abs(ang) > 90 ? ' scale(1,-1)' : ''));
    } else if (nm === 'arrive') {
      gCar.attr('opacity', (1 - cl(raw / .35)) * globeO).attr('transform', 'translate(' + s2[0] + ',' + s2[1] + ')');
    } else gCar.attr('opacity', 0);

    cityG.attr('opacity', cityO);
    if (cityO > .01) cityD.attr('opacity', function (d) { return .35 + .65 * (.5 + .5 * Math.sin(ms / 380 + d.p)); })
      .attr('transform', function (d) { return 'translate(' + (s2[0] + Math.cos(d.a) * d.d) + ',' + (s2[1] + Math.sin(d.a) * d.d * .7) + ')'; });
    bridge.attr('opacity', cityO * .9).attr('transform', 'translate(' + (s2[0] + 24) + ',' + (s2[1] + 26) + ')');

    gSpeed.attr('opacity', spdO);
    if (spdO > .01) speed.attr('y1', function (d) { return d.y; }).attr('y2', function (d) { return d.y; })
      .attr('x1', function (d) { return (ms * d.s * 1.2) % (W + 140) - d.l; })
      .attr('x2', function (d) { return (ms * d.s * 1.2) % (W + 140); });
    gHUD.attr('opacity', hudO);
    gFlash.attr('opacity', flashA);
    shk.attr('transform', shake > 0
      ? 'translate(' + (Math.sin(ms / 41) * shake) + ',' + (Math.cos(ms / 33) * shake * .8) + ')' : null);

    if (ms >= TOTAL) { engine(false); timer.stop(); }
  });
}

render();
</script>
